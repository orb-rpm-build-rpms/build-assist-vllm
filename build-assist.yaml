# Build manifest for packaging vLLM (ROCm) for Fedora.
#
# Base is fedora-44-x86_64. F44 (not F45) because vLLM requires Python
# >=3.10,<3.15: F44 ships Python 3.14, F45 ships 3.15 (which also breaks
# torch.compile). Anything already present at a sufficient version in the f44
# base repos is NOT listed here (mock pulls it automatically). Only packages
# that must be built are listed:
#   * Fedora dist-git, non-default branch  -> version bump available upstream
#   * vllm-packages (local dist-git)       -> not in Fedora, or a version
#                                             Fedora doesn't ship yet; capped
#                                             deps track a release-X.Y branch
#                                             (see below) instead of main.
#
# Requirements analysed from the vLLM checkout at vllm/ :
#   requirements/common.txt, requirements/rocm.txt, requirements/build/rocm.txt
#
# Satisfied by the f44 base (no build needed), for reference:
#   numpy, regex, cachetools, psutil, sentencepiece, requests, tqdm,
#   py-cpuinfo, aiohttp, openai (2.24.0), pydantic (2.12.5), prometheus_client,
#   pillow, tiktoken, lark (1.2.2), typing_extensions, filelock, jsonschema,
#   pyzmq, msgspec, pyyaml, six, einops, cloudpickle, watchfiles,
#   python-json-logger, ninja, cbor2, ijson, setproctitle, anthropic,
#   opentelemetry-api, datasets, pytest-asyncio, packaging, setuptools-rust,
#   wheel, jinja2, cmake, amdsmi (ROCm), fastapi (0.136.3, in vLLM's <0.137)
# Caveats for the vLLM .spec (base packages, but non-obvious names/versions):
#   * opencv-python-headless -> satisfied by the python-opencv-python-headless
#                               name-bridge metapackage (below), which maps the
#                               PyPI name onto python3-opencv (4.13.0, cv2)
#   * setuptools <80 pin      -> use python3-setuptools80 (f44 default is 80.10.2)
#
# F44 base too OLD for vLLM -- these must be rebuilt from newer branches
# (added under the dist-git section below as they are prepared):
#   * torch 2.9.1        -> need ==2.12.0 (compressed-tensors needs >=2.10);
#                           very large build, built on a dedicated server
#                           (python-torch:release-2.12, from f45's 2.12.0). The
#                           ROCm build also drags in two more too-old base bits:
#                           cpuinfo (below) and ROCm itself (F44 7.1.1 vs the
#                           7.2.2 torch 2.12 wants; worked around in the spec by
#                           force-including <chrono>/<format> so 7.1.1's
#                           host_defines.h cannot poison GCC 16's <format>).
#   * cpuinfo 24.09      -> torch 2.12 calls cpuinfo_has_x86_avx10_1()/_2();
#                           needs f45's 25.11 (built as cpuinfo:f45 above).
#   * protobuf 3.19.6    -> need >=5.29.6 (major ABI jump; affects grpcio).
#   * starlette 0.52.1   -> need >=1.0.1.
#   * tokenizers 0.22.2  -> transformers 5.16.1 needs >=0.23.1,<0.24.0.
#   * safetensors 0.7.0  -> transformers 5.16.1 needs >=0.8.0.
#   * huggingface_hub, transformers, peft: absent from f44 (built below).

base: fedora-44-x86_64
localrepo: /home/gmessmer/git/vllm-build/vllm-result/

build:
  # ---- Already in Fedora, but the f45 version is too old: build a newer
  #      branch straight from Fedora dist-git. --------------------------------
  - type: dist-git
    url: https://src.fedoraproject.org/rpms/
    packages:
      # huggingface_hub: need >=1.28.0; f45 has 1.27.0, rawhide has 1.30.0.
      - python-huggingface-hub:rawhide

      # click: httpx2 2.12.0's cli extra build-requires click >=8.4.2; F44 has
      # 8.3.x. f45 ships 8.4.2. No Linux runtime deps (colorama is Windows-only),
      # so no cascade. Built before httpx2.
      - python-click:f45

      # httpx2: mcp 2.1.1 needs httpx2 >=2.5.0; F44 ships 2.3.0. f45 has 2.12.0
      # (exactly what vLLM's frozen test files pin). A single srpm produces BOTH
      # python3-httpx2 and python3-httpcore2, so this one build also bumps
      # httpcore2 (2.3.0 -> 2.12.0, which httpx2 2.12.0 pins exactly). Its other
      # deps (h11 0.16, truststore 0.10.4, idna 3.18, anyio) are already in the
      # base. Built before python-mcp.
      - python-httpx2:f45

      # cpuinfo: torch 2.12 calls cpuinfo_has_x86_avx10_1()/_2(), added upstream
      # after F44's 24.09 snapshot; f45 ships 25.11 which has them. torch builds
      # with USE_SYSTEM_CPUINFO=ON, so the newer system library is needed (it
      # fails to compile aten/src/ATen/cpu/Utils.cpp otherwise). Built before
      # python-torch (this dist-git group runs before the vllm-packages group).
      - cpuinfo:f45

      # Build deps that were needed to build anthropic locally.
      - python-hatchling:main
      - python-jaraco-path:main

  # ---- Not packaged in Fedora (or Fedora's version is too old for any
  #      branch): build from freshly generated specs in vllm-packages.
  #      Ordered leaves-first for dependency resolution. Specs still need to
  #      be created (pyp2spec) and committed before these will build. --------
  - type: dist-git
    url: /home/gmessmer/git/vllm-build/vllm-packages/
    packages:
      # -- F44 base too old: rebuilt from a newer Fedora branch. These are
      #    Fedora dist-git packages cloned into vllm-packages and pinned to a
      #    release-X.Y branch (created at the rawhide/f45 commit that carries
      #    the needed version). F44 ships them below what vLLM/transformers
      #    require. tokenizers is itself capped (<0.24.0 by transformers), so
      #    its branch tracks the 0.23 line rather than rawhide. Both Rust
      #    packages still use Fedora's crates via the cargo buildrequires
      #    generator; if F44's crate versions don't satisfy them they'll need
      #    the vendoring treatment (rust-sources.sh), like llguidance below.
      #    torch (2.9.1 -> 2.12.0) is the same too-old-base case and is included
      #    below; protobuf 3.19.6 is the remaining deferred one (see blockers).
      - python-safetensors:release-0.8    # F44 has 0.7.0; transformers needs >=0.8.0
      - python-tokenizers:release-0.23    # F44 has 0.22.2; transformers needs >=0.23.1,<0.24.0
      - python-starlette:release-1.6      # F44 has 0.52.1; vLLM needs >=1.0.1 (fastapi 0.136 allows >=0.46)
      # xnnpack: exact BuildRequires of python-torch, and it links cpuinfo. The
      #   cpuinfo:f45 bump above changes cpuinfo's fully-versioned soname
      #   (libcpuinfo.so.24.09.26 -> .25.11.14), so the base xnnpack no longer
      #   matches. Same upstream snapshot as the base (0.0^git20240814.312eb7e,
      #   what torch pins), rebuilt against cpuinfo 25.11 with an empty commit
      #   lifting the release to -6.fc44 so it outranks the base's -5.fc44. Built
      #   before python-torch; cpuinfo:f45 is already in the localrepo (prior group).
      - xnnpack:f44
      # torch: F44 has 2.9.1; vLLM pins ==2.12.0 and compressed-tensors needs
      #   >=2.10.0. f45 ships 2.12.0 (protobuf feature off, so no protobuf 6.x
      #   bump needed -- F44's 3.19.6 suffices). Very large native build; per the
      #   plan it is built on a dedicated server and imported into the localrepo.
      - python-torch:release-2.12         # F44 has 2.9.1; compressed-tensors needs >=2.10.0 (vLLM pins ==2.12.0)

      # -- simple / few deps --
      # opencv-python-headless: name-bridge metapackage. Fedora's python3-opencv
      #   provides cv2 but advertises only python3dist(opencv), so PyPI-style
      #   requirements on opencv-python-headless (mistral_common[image], vLLM)
      #   don't resolve. This files-less package supplies that name and requires
      #   python3-opencv -- fixes it once for all consumers, no per-spec patching.
      #   Built before mistral-common (and vLLM), which need it.
      - python-opencv-python-headless:main
      - python-partial-json-parser:main
      - python-pybase64:main
      - python-blake3:main
      - python-astor:main        # dependency of depyf; not packaged in Fedora
      - python-depyf:release-0.20   # vLLM pins depyf ==0.20.0 (exact)
      - python-openai-harmony:main
      - python-interegular:main   # dependency of lm-format-enforcer; not in Fedora
      # vLLM pins lm-format-enforcer ==0.11.3 (exact), so it tracks a release
      # branch rather than main to make the pinned-not-latest choice explicit.
      - python-lm-format-enforcer:release-0.11

      # -- outlines-core: pins pyo3 0.27, hf-hub 0.4.1 and tokenizers 0.22.2 --
      #    all present in f45 only at other versions (0.29.2 / 0.4.3 / 0.23.1).
      #    Like python-llguidance, it vendors its whole Rust crate graph and
      #    builds it offline (python-outlines-core/rust-sources.sh runs
      #    `cargo vendor` at build time), so none of those crates need a Fedora
      #    package -- no pyo3-0.27 / hf-hub-0.4.1 / tokenizers-0.22.2 builds.
      - python-outlines-core:release-0.2   # vLLM pins outlines_core ==0.2.14

      # -- llguidance: its Rust crate graph needs pyo3 0.28, tokenizers 0.21, and
      #    four crates Fedora doesn't package at all (derivre, jsonschema,
      #    referencing, tiktoken-rs). Packaging each -- even via release branches
      #    -- would be a large cascade, so this package instead vendors its whole
      #    Rust dependency tree and builds it offline. The vendor tarball is not
      #    kept in a lookaside cache: python-llguidance/rust-sources.sh runs
      #    `cargo vendor` at build time to regenerate it. No pyo3-0.28 or
      #    tokenizers-0.21 Fedora packages are required as a result.
      - python-llguidance:release-1.7   # vLLM pins llguidance >=1.7.0,<1.8.0 (latest 1.8.0 is excluded)
      - python-model-hosting-container-standards:release-0.1   # vLLM pins >=0.1.14,<1.0.0
      - python-prometheus-fastapi-instrumentator:main

      # -- setuptools_scm 8.2.0: compressed-tensors' build-system.requires hard-
      #    pins setuptools_scm==8.2.0, but f45 ships 10.2.1. This is the reverse
      #    of the "need something newer" case -- the build needs an OLDER version
      #    than the base. Fedora's own dist-git checked out at the 8.2.0 commit
      #    on a release-8.2 branch supplies it, demonstrating that the
      #    upstream-following branch strategy handles upper-bounded build deps
      #    just as cleanly. Built before its consumer (leaves-first).
      - python-setuptools_scm:release-8.2
      # transformers is built before compressed-tensors: compressed_tensors
      # imports transformers at module top level and requires >=4.45 at build
      # time (its %check import), and f45 ships no transformers at all. 5.16.1
      # satisfies both that and vLLM's >=5.10.4. Its own core pins are met by the
      # base/localrepo (tokenizers 0.23.1, huggingface_hub 1.30.0, safetensors
      # 0.8.0), so it needs no further release branches.
      - python-transformers:main
      - python-compressed-tensors:release-0.17   # vLLM pins compressed-tensors ==0.17.0 (latest 0.18.0)
      - python-mistral-common:main

      # -- opentelemetry stack. F44 ships only opentelemetry-api (1.39.1); the
      #    sdk and semantic-conventions are separate srpms it lacks. The SDK pins
      #    api and semantic-conventions to its exact version, so the whole stack
      #    is aligned to the base api 1.39.1 (sdk 1.39.1 <-> semantic-conventions
      #    0.60b1) to avoid rebuilding api. vLLM only needs >=1.27.0. Ordered
      #    leaves-first: semantic-conventions -> sdk -> semantic-conventions-ai.
      #    exporter-otlp is deferred to the grpcio cluster below (it pulls
      #    opentelemetry-exporter-otlp-proto-grpc -> grpcio).
      - python-opentelemetry-semantic-conventions:main      # 0.60b1; sdk pins ==0.60b1, semconv-ai needs >=0.59b0
      - python-opentelemetry-sdk:main                       # 1.39.1 (matches base api)
      - python-opentelemetry-semantic-conventions-ai:main   # 0.5.1; needs sdk>=1.38 + semconv>=0.59b0

      # -- newer than any Fedora branch ships --
      # mcp-types: mcp 2.x split its wire-protocol Pydantic models into a
      #   separate distribution (mcp requires mcp-types==2.1.1). Not in Fedora;
      #   generated with pyp2spec. Only needs pydantic/typing-extensions (base).
      #   Built before python-mcp (leaves-first).
      - python-mcp-types:main   # mcp 2.1.1 requires mcp-types ==2.1.1
      # mcp: need >=2.0.0,<3.0.0; Fedora (incl. rawhide) has only 1.27.1.
      - python-mcp:release-2.1   # vLLM pins mcp >=2.0.0,<3.0.0 (latest 2.2.0)

      # -- heavier builds (native/large dep trees) --
      # apache-tvm-ffi is a BUILD dep of both xgrammar (>=0.1.9) and tilelang
      # (>=0.1.10,~=0.1.0), so it is built first. It is itself a leaf: only
      # typing-extensions + ninja + gcc, all in the base. 0.1.10 satisfies both
      # consumers and matches vLLM's pin.
      - python-apache-tvm-ffi:release-0.1   # vLLM pins apache-tvm-ffi ==0.1.10 (latest 0.1.13.post3)
      - python-xgrammar:release-0.2   # vLLM pins xgrammar >=0.2.1,<1.0.0 (latest 0.2.6)
      - python-peft:main
      - python-timm:main
      - python-tensorizer:release-2.10   # vLLM pins tensorizer ==2.10.1 (latest 2.12.1)
      - python-fastsafetensors:main
      - python-conch-triton-kernels:release-1.2   # vLLM pins conch-triton-kernels ==1.2.1 (latest 1.3)
      - python-numba:release-0.65   # vLLM (rocm) pins numba ==0.65.0 (latest 0.67.0)
      - python-tilelang:release-0.1   # vLLM pins tilelang ==0.1.10 (latest 0.1.14)

      # -- KNOWN BLOCKERS: left out until resolved --
      #
      # runai-model-streamer, amd-quark, mooncake-transfer-engine-rocm:
      #   wheel-only on PyPI (no sdist at the required version), so pyp2spec
      #   cannot generate a source-buildable spec. Each needs a hand-written
      #   spec built from its upstream git (type: git) instead:
      #     runai-model-streamer      -> github.com/run-ai/runai-model-streamer
      #     amd-quark (0.12.post1)    -> github.com/amd/quark  (sdist only for 0.1.0)
      #     mooncake-transfer-engine  -> github.com/kvcache-ai/Mooncake (C++/RDMA)
      # - python-runai-model-streamer:main
      # - python-amd-quark:main
      # - python-mooncake-transfer-engine-rocm:main
      #
      # grpcio / grpcio-reflection: vLLM pins ==1.78.0, Fedora ships 1.48.4
      #   (all branches). A jump this large is a substantial rebuild, and it is
      #   tied to the protobuf bump below (grpcio 1.78 needs protobuf >=5).
      # - python-grpcio:main
      # - python-grpcio-reflection:main
      #
      # opentelemetry-exporter-otlp (+ proto-grpc, proto-http): vLLM needs
      #   exporter-otlp >=1.27.0 (common.txt). The meta package pulls
      #   opentelemetry-exporter-otlp-proto-grpc, which requires grpcio, so it is
      #   blocked on the grpcio/protobuf cluster above. Build at 1.39.1 to match
      #   the opentelemetry stack (base api 1.39.1) once grpcio lands; the http
      #   exporter (proto-http) needs only requests (in the base).
      # - python-opentelemetry-exporter-otlp-proto-http:main
      # - python-opentelemetry-exporter-otlp-proto-grpc:main
      # - python-opentelemetry-exporter-otlp:main
      #
      # protobuf: vLLM needs >=5.29.6, but F44 ships 3.19.6. F45/rawhide has
      #   6.33.5. Deferred only because nothing in the queue above needs it yet
      #   (transformers touches protobuf solely via the optional
      #   sentencepiece_model_pb2 module, skipped in %check); it is first needed
      #   by grpcio and vLLM itself. Its ~38 F44 reverse-deps are IRRELEVANT --
      #   this is a private localrepo, so we never break unrelated F44 packages;
      #   only vLLM's subtree resolves against our build. The only real cost is
      #   protobuf's own build dep abseil-cpp (F44 20260107.1 vs F45 20260526.0,
      #   same-year snapshots) -- worst case one extra abseil rebuild, not a
      #   cascade. Clone rpms/protobuf, branch at 6.33.5.
      # - protobuf:release-6.33
      #
      # torch: NOW ENABLED above (python-torch:release-2.12). Was deferred as a
      #   very large native build; it is the compressed-tensors blocker
      #   (needs >=2.10.0) so it has been added to the queue to be built on a
      #   dedicated server and imported into the localrepo.
      #
      # fastapi: SATISFIED by the F44 base (0.136.3, within vLLM's
      #   >=0.133,<0.137). It was a blocker only on F45, which shipped 0.141.1
      #   (too new). No build needed on F44.
